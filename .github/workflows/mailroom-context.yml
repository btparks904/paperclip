name: Mailroom context

on:
  pull_request:

permissions:
  contents: read

jobs:
  mailroom-context:
    name: Mailroom context authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test targeted context authorization
        run: node --test scripts/smoke/mailroom-run-context.test.mjs
